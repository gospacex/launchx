# ============================================================
# mall 示例 · 商品域（srv 档）
#
# 纪律：端口 / DSN / 中间件地址一律来自本文件，Go 代码不出现任何硬编码地址。
# 本档不建 webx，故**不出现** webx 段；注册进 consul 由 launchx 按 mode 自己做
# （地址取 service.self.addr），业务侧不调 Register / Deregister。
#
# 运行前导出库密码：export HUBX_DB_PW=hubx123
# ============================================================

service:
  name: demo-product             # 服务名 = Jaeger 的 service，也是 dbx/cachex/mqx/kvx 的实例名
  mode: srv                     # 四档之一：monolith / bff / srv / gateway
  addr: "127.0.0.1:9021"        # rpcx(kitex) 监听地址
  self:
    addr: "${SRV_PRODUCT_SELF_ADDR}"  # 容器内外地址不一致时显式声明注册地址

# 调用链：全局闸 + 组件级开关。trace.on.<name> 只裁决入链，不裁决构造。
# 商品域用到了 db / cache / mq / kv / lock / registry 六类，缺一项的 span
# 会在 Jaeger 上静默消失（不是报错），故这里逐项显式列出。
trace:
  enabled: true
  endpoint: "127.0.0.1:4318"   # jaeger OTLP/HTTP
  on:
    db: true
    cache: true
    mq: true
    kv: true
    lock: true
    registry: true

logx:
  level: info
  otel:
    # 组件级 span 开关。**故意不写 exporter/endpoint**：logx.Config 虽能解析这两键，
    # 但 launchx 装配路径从不读它们（span 出口由 trace.endpoint 决定，见
    # internal/telemetry.Init），写了只会让人误以为「日志走 otlp」。
    enable_trace: true

# 指标（Prometheus 拉取式）。srv 档**没有 HTTP 面**，故必须显式给采集口地址：
# 装配期单起一个只服务 /metrics 的监听，不占服务端口、不参与业务路由。
# enabled=true 却漏配 addr 时**装配期即退**（否则指标被采集却无人能读，且不报错）。
metrics:
  enabled: true
  addr: "127.0.0.1:9033"
# ----- 鉴权：只校验边界层（bff）透传下来的身份，不重复验签 -----
# require=false 表示"内网可信、任何入站 RPC 都放行"：只在受控网络里用。
# 这一段整体缺失时装配层按 **true** 处理（安全默认值），不会静默裸奔。
auth:
  require: true
  ticket_ttl: 5m            # 与 bff 签发的票据有效期保持一致

# 地基失败即退：连不上库就启动失败，而不是降级成"起来但落不了库"。
strict:
  db: true

xmiddleware:

  # ----- sqlx：私有库 product_db（账号 mall_rw）-----
  sqlx:
    driver: gorm
    databases:
      demo-product:              # 实例名须与 service.name 一致（dbx loader 按名字取段）
        dsn: "mall_rw:${HUBX_DB_PW}@tcp(127.0.0.1:3306)/product_db?charset=utf8mb4&parseTime=True&loc=Local"
        max_open_conns: 20
        max_idle_conns: 5
        conn_max_lifetime: 5m
        conn_max_idle_time: 1m
        tracing:
          enabled: true

  # ----- cachex：商品详情缓存（可失效的派生状态，改价/上下架后 Delete）-----
  cachex:
    driver: redis
    enable_trace: true
    instances:
      demo-product:
        addr: "127.0.0.1:6379"
        db: 0
        pool_size: 50

  # ----- mqx：商品创建事件（topic product.created.v1，经 outbox 补发）-----
  mqx:
    driver: kafka
    instances:
      demo-product:
        brokers:
          - "127.0.0.1:9092"
        enable_trace: true
        # 键位口径（mqx 现状，实测）：producer 的目标 topic 读的是 consumer.topic，
        # 配 producer.topic 不生效（发送时 topic 为空串，报 Unknown Topic Or
        # Partition）。业务 Message 侧不再自带 topic（kafka-go both-specified 红线）。
        consumer:
          topic: product.created.v1
          # group_id 必须显式写：mqx 的 FillDefaults 在缺省时统一填 "mqx-group"，
          # 于是所有服务挤进同一个消费组 —— 订阅同一 topic 的服务会互相抢分区，
          # 表现为「消息投出去了但没人收到」。消费组按服务命名是硬要求。
          group_id: demo-srv-product
        producer:
          batch_size: 100
          batch_timeout: 10ms
          required_acks: -1   # sarama WaitForAll

  # ----- kvx：限流计数 + 商品访问热度计数（两项都需要原子 Incr）-----
  kvx:
    driver: redis
    enable_trace: true
    instances:
      demo-product:
        addr: "127.0.0.1:6379"
        db: 1
        pool_size: 30

  # ----- lockx：上下架按商品维度互斥（防并发改状态互相覆盖）-----
  lockx:
    driver: redis
    addr: "127.0.0.1:6379"
    namespace: demo-product
    ttl: 10s
    enable_trace: true
    retry:
      enabled: true
      max_attempts: 3
      backoff_ms: 50

  # ----- coordx：注册中心（注册/注销由 launchx 按 mode 负责）-----
  coordx:
    driver: consul
    addr: "127.0.0.1:8500"
    enable_trace: true
