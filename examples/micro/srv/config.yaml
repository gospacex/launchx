# ============================================================
# 微服 demo（srv 档）配置
#
# 端口 / DSN / 中间件地址一律来自本文件，业务 Go 代码不出现任何硬编码地址
# （同一份二进制与配置副本才能被网格直接复用，验收陷阱 14）。
#
# 本档不建 webx，故**不出现** webx 段；注册进 consul 由 launchx 按 mode
# 自己做（地址取 service.self.addr），demo 侧不调 Register / Deregister。
#
# 运行前导出库密码：export HUBX_DB_PW=hubx123
# ============================================================

service:
  name: demo-srv              # 服务名 = Jaeger 的 service，也是 dbx/kvx/mqx 的实例名
  mode: srv                   # 四档之一：monolith / bff / srv / gateway
  addr: "127.0.0.1:9013"      # rpcx(kitex) 监听地址，沿用 micro_apps 原 srv-order 端口
  self:
    # 注册进 consul 的自身地址。launchx 按 service.self.addr → service.addr
    # 顺序取第一个非空值；值支持 ${ENV}（configsrc 对 GetString 施加
    # os.ExpandEnv），网格形态设该 env 即可，未设置则自动回落到上面的 addr。
    addr: "${DEMO_SRV_SELF_ADDR}"

# 调用链：全局闸 + 组件级开关。trace.on.db / trace.on.mq 是反向断言的唯一开关。
trace:
  enabled: true
  endpoint: "127.0.0.1:4318"   # jaeger OTLP/HTTP
  on:
    db: true
    kv: true
    mq: true
    registry: true

logx:
  level: info
  otel:
    enable_trace: true
    exporter: otlp
    endpoint: "127.0.0.1:4318"

# 地基失败即退：db 连不上就启动失败，而不是降级成"起来但落不了库"。
strict:
  db: true

xmiddleware:

  # ----- sqlx：私有库 order_db（账号 order_rw）-----
  sqlx:
    driver: gorm
    databases:
      demo-srv:                # 实例名须与 service.name 一致（dbx loader 按名字取段）
        dsn: "order_rw:${HUBX_DB_PW}@tcp(127.0.0.1:3306)/order_db?charset=utf8mb4&parseTime=True&loc=Local"
        max_open_conns: 20
        max_idle_conns: 5
        conn_max_lifetime: 5m
        conn_max_idle_time: 1m
        tracing:
          enabled: true

  # ----- kvx：限流计数（原子 Incr；读不到即放行，fail-open）-----
  #
  # 这一段原本是 cachex。cachex 没有原子自增，计数只能「读出来 +1 再写回」，
  # 并发下计数丢失会把「限了却被打穿」伪装成「流量未超」，故迁到 kvx。
  # demo-srv 除限流外不再使用缓存，所以是**替换**而非追加 —— 留一段配了却
  # 没人用的组件，等于给自己埋一个「cache span 为什么消失了」的假故障。
  kvx:
    driver: redis
    enable_trace: true
    instances:
      demo-srv:
        addr: "127.0.0.1:6379"
        db: 0
        pool_size: 30

  # ----- mqx：outbox 补发用的生产者（topic order.completed.v1）-----
  mqx:
    driver: kafka
    instances:
      demo-srv:
        brokers:
          - "127.0.0.1:9092"   # 本机 compose 现行端口（**不**用 srv-order 旧端口 19093）
        enable_trace: true
        producer:
          topic: order.completed.v1
          batch_size: 100
          batch_timeout: 10ms
          # acks=all：sarama RequiredAcks -1 = WaitForAll
          required_acks: -1

  # ----- coordx：注册中心（注册/注销由 launchx 按 mode 负责）-----
  coordx:
    driver: consul
    addr: "127.0.0.1:8500"
    enable_trace: true
