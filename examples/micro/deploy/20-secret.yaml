# =============================================================================
# 微服案例的两份 Secret（数据库口令 / 演示令牌）
# -----------------------------------------------------------------------------
# 为什么从 ConfigMap 里分出来：
#   这两样东西此前要么以明文躺在 config.yaml（会被 A 项整份搬进 ConfigMap），
#   要么以 env value 明文写在 Deployment 里。ConfigMap 不加密、常被整体导出
#   （`kubectl get cm -o yaml`）、会原样进 GitOps 仓库；env 明文则会在
#   `kubectl describe pod` 与 CI 日志里回显。换成 Secret 至少做到三点：
#     ① 与清单阅读权限分离（可单独收紧 RBAC 到 get secret）；
#     ② describe pod 只显示 `secretKeyRef`，不回显值；
#     ③ 轮换只改这一处，六个 Deployment 不动。
#
# ⚠️ 两个值都是**教学占位**，不是真口令：
#   - `HUBX_DB_PW: hubx123` 与宿主 docker compose 里 mysql 的初始化口令一致；
#   - `demo-auth-token: demo-token` 与 `examples/micro/scripts/{e2e,chain,auth-probe}.sh`
#     的 `DEMO_TOKEN` 默认值一致 —— 保持这个一致，脚本在集群里也能直接跑；
#   - 生产形态：本文件**只留骨架不进仓**，真值来自 External Secrets /
#     sealed-secrets / Vault 并按周期轮换；令牌更该换成签发服务（含轮换与吊销），
#     见下面 `demo-auth` 的头注。
#   因此这里刻意用 `stringData` 而不是 `data`：让人一眼看清「这就是占位」，
#   而不是 base64 之后假装它不是明文（与 mesh 组 05-secret.yaml 同口径）。
#
# 消费侧：`micro.yaml` 四个 srv Deployment 注入 HUBX_DB_PW（DSN 里的
# `${HUBX_DB_PW}` 占位由 configsrc 的 os.ExpandEnv 展开），bff Deployment 注入
# DEMO_AUTH_TOKEN（`demo.auth_token` 同样走 GetString，故 ${ENV} 同样生效）。
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: demo-db
  namespace: launchx-demo
type: Opaque
stringData:
  HUBX_DB_PW: hubx123 # 教学占位，见头注 ⚠️；与宿主 compose 的 mysql 一致
---
# ----- 演示令牌（bff 的 demo.auth_token）-----
#
# 配置的写法是 `auth_token: "${DEMO_AUTH_TOKEN}"`（micro.yaml 的 bff.config.yaml），
# 值由本 Secret 经 secretKeyRef 注入 DEMO_AUTH_TOKEN。展开点在本仓配置层：
# `internal/configsrc/expand.go` 对 GetString 施加 os.ExpandEnv，而
# `examples/micro/bff/app/setup.go:177` 正是用 cfg.GetString("demo.auth_token")
# 读它 —— 与 DSN 里的 ${HUBX_DB_PW} 同一条路径，口径已在本仓其它配置里生效。
#
# 仍然是静态令牌：播种一次即长期有效，没有过期、没有吊销。**生产必须换成签发
# 服务**（签发 / 轮换 / 吊销三件事缺一不可），这里的形态仅为让「边界鉴权那次
# 缓存查询」在 demo 里真的有东西可查（setup.go 启动期把 token → user_id 播种进
# cachex）。换掉它时同步改 `examples/micro/scripts/*.sh` 的 DEMO_TOKEN，否则
# 脚本拿到的还是旧令牌，表现为全员 401。
apiVersion: v1
kind: Secret
metadata:
  name: demo-auth
  namespace: launchx-demo
type: Opaque
stringData:
  demo-auth-token: demo-token # 教学占位，见头注 ⚠️；生产换签发服务
