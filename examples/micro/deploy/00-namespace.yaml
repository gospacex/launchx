# =============================================================================
# 微服案例的命名空间
# -----------------------------------------------------------------------------
# 单独成文件（而不是塞在 micro.yaml 头部）只有一个理由：`kubectl apply -f
# <目录>` 按文件名字母序处理，命名空间必须排在最前面，否则同目录里带
# `namespace: launchx-demo` 的资源会先于命名空间被提交，报
# `namespaces "launchx-demo" not found`。编号前缀沿用 mesh 组的写法
# （`deploy/shared/00-namespace.yaml`）。
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: launchx-demo
