# ============================================================
# 微服 demo（gateway 档）配置
#
# 端口 / 路由表 / 上游兜底地址一律来自本文件，业务 Go 代码不出现任何硬编码
# 地址（换部署形态只改本文件与进程启动参数，不重新编译）。
#
# 本档**不注册**（gateway 是流量入口，注册它只会让注册中心多一批无人调用的
# 条目）：coordx 段只用于**发现**，demo 侧不调 Register / Deregister。
# ============================================================

service:
  name: demo-gateway               # 服务名 = Jaeger 的 service
  mode: gateway                    # 四档之一：monolith / bff / srv / gateway
  addr: "127.0.0.1:8080"           # HTTP 监听地址（ACCEPTANCE §13.2 端口定稿）
  upstream:
    # 注册中心拿不到实例时的直连兜底目标：键名 service.upstream.<被调服务名>
    # 与 launchx 内部读兜底目标的键一致（internal/mode/webx.go）。
    # bff 在注册中心里的注册名是 demo-bff，故此处键用 demo-bff。
    demo-bff: "127.0.0.1:8081"

webx:
  addr: "127.0.0.1:8080"
  timeout: 5s
  rate_limit_rps: 100
  rate_limit_burst: 200
  cors_origins: []
  health_prefix: /healthz

# 路由表：prefix 命中即转给 upstream；strip=true 表示转发前剥掉 prefix
# （/api/order/1001 → 上游 /order/1001）。详见 README §2。
gateway:
  routes:
    - prefix: /api
      upstream: demo-bff
      strip: true
      name: api                    # 决定 span 名 gateway.proxy.<name>

# 调用链：全局闸 + 组件级开关。trace.enabled=false 时各项组件级开关不再产出
# 子 span（T13 反向断言的唯一开关）。
trace:
  enabled: true
  endpoint: "127.0.0.1:4318"   # jaeger OTLP/HTTP
  on:
    registry: true

logx:
  level: info
  otel:
    enable_trace: true
    exporter: otlp
    endpoint: "127.0.0.1:4318"

# 组件的启用是 presence-based（配了段才构造），失败姿态由 strict.<name> 裁决。
# 本档刻意不设 strict：consul 不在时须带病运行（降级 Warn + 进程不退出），
# 见 ACCEPTANCE §10 降级路径。

xmiddleware:

  # ----- coordx：注册中心（本档只用来发现上游，不注册自身）-----
  # 地址键 xmiddleware.coordx.addr（兼容 xmiddleware.consul.addr），
  # 见 internal/mode/mode.go 的 registryAddr。
  coordx:
    driver: consul
    addr: "127.0.0.1:8500"
    enable_trace: true

  # gateway 不建数据层、不接 MQ：无 sqlx / cachex / mqx 段。
