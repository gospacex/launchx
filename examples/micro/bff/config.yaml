# ============================================================
# 微服 demo（bff 档）配置
#
# 端口 / 注册中心地址 / 下游目标一律来自本文件，业务 Go 代码不出现任何硬编码
# 地址（换部署形态只改本文件与进程启动参数，不重新编译）。
#
# 本档注册进 consul 由 launchx 按 mode 自己做（地址取 service.self.addr →
# service.addr），demo 侧不调 Register / Deregister。
# ============================================================

service:
  name: demo-bff                # 服务名 = Jaeger 的 service，也是 consul 注册名
  mode: bff                     # 四档之一：monolith / bff / srv / gateway
  addr: "127.0.0.1:8081"        # HTTP 监听地址（ACCEPTANCE §13.2 端口定稿）
  self:
    # 注册进 consul 的自身地址。launchx 按 service.self.addr → service.addr
    # 顺序取第一个非空值；值支持 ${ENV}（configsrc 对 GetString 施加
    # os.ExpandEnv），容器/多网卡环境设该 env 覆盖即可，未设置则回落上面的 addr。
    addr: "${DEMO_BFF_SELF_ADDR}"
  upstream:
    # 注册中心不可用时的直连兜底目标：launchx 读 service.upstream.<被调服务名>。
    # 注册中心配了就走发现、本值不生效；留空则无兜底，故这里给出四服端口，
    # 便于不启 consul 时也能把整条链路跑通（与 srv-*/config.yaml 的 addr 一致）。
    demo-product: "127.0.0.1:9021"
    demo-stock:   "127.0.0.1:9023"
    demo-order:   "127.0.0.1:9022"
    demo-points:  "127.0.0.1:9024"

webx:
  addr: "127.0.0.1:8081"
  timeout: 5s
  rate_limit_rps: 100
  rate_limit_burst: 200
  cors_origins: []
  health_prefix: /healthz

# 调用链：全局闸 + 组件级开关。trace.enabled=false 时各项组件级开关不再产出
# 子 span（T13 反向断言的唯一开关）。
trace:
  enabled: true
  endpoint: "127.0.0.1:4318"   # jaeger OTLP/HTTP
  on:
    registry: true

logx:
  level: info
  otel:
    # 组件级 span 开关。**故意不写 exporter/endpoint**：logx.Config 虽能解析这两键，
    # 但 launchx 装配路径从不读它们（span 出口由 trace.endpoint 决定，见
    # internal/telemetry.Init），写了只会让人误以为「日志走 otlp」。
    enable_trace: true

# 指标（Prometheus 拉取式）。装配期建 MeterProvider 并设为 otel 全局 ——
# HTTP 面自动挂到 webx 的 MetricsPrefix（缺省 /metrics，并豁免入口限流），
# RPC 客户端/服务端中间件也按这一开关挂。**关掉（false 或不写）即不建 provider**，
# meter 退回 noop：不产生指标、不留采集口，但 Instrument 调用点仍在（不会少埋点）。
metrics:
  enabled: true
# ----- 鉴权（本档是 HTTP 边界，唯一验凭据的地方）-----
# require=false 会让所有请求免鉴权放行：只在可信网络内部排障时临时使用，
# 上线环境必须是 true。缺这一段时装配层按 **true** 处理（安全默认值）。
auth:
  require: true
  ticket_ttl: 5m            # 签发给下游域服的身份票据有效期

# demo 自身的业务参数（非地址类，但同样不写死在代码里）。
demo:
  # 演示用静态令牌（Authorization: Bearer <token>）。
  # 生产里这活属于签发服务，含过期轮换与吊销；demo 在启动时把它播种进缓存，
  # 让鉴权中间件的那次缓存查询真的有东西可查。
  auth_token: "demo-token"
  seed_user_id: 1001        # 该令牌绑定的用户 ID

# ----- dtm 事务编排（下单走 dtm Saga）-----
#
# dtm server 的 gRPC 端口（官方双端口里的那个；HTTP 口 :36789 是给外部 HTTP
# 分支用的，本档四域分支全是 gRPC，用不到）。它与四域各自的分支面地址是
# **两回事**：这一段是「事务去哪儿登记」，下面 dtm.branches 是「事务的分支回调
# 谁」。两者都只在这里出现一次，Go 代码零硬编码。
#
# 缺省值 127.0.0.1:36790 写在本文件而不是代码里 —— 写进代码会让
# examples_addr_hygiene_test.go 的地址红线变红，且换部署形态就得重新编译。
dtm:
  branches:
    # 四个分支面的 gRPC 监听地址，与各域 config.yaml 的 dtm.branch.listen_addr
    # 逐字对应（同一个进程、两个监听口：kitex 面 + dtm 分支面）。
    # 分支 URL 由编排侧拼成 `<host:port>/<proto-service>/<method>`，
    # **不带 scheme** —— dtm 的默认 driver 见到 "://" 会直接报错。
    #
    # **键是「域」不是「分支方法」**：Saga 与 TCC 共用这四个域地址，两链的方法
    # 名不同（TCC：stock/points 的 TryFreeze·ConfirmFreeze·CancelFreeze 与
    # order 的 TryPlace·ConfirmFreeze·CancelFreeze；Saga：Deduct·Release /
    # CreateOrder·CancelOrder / AddSales·ReduceSales / Debit·Refund），
    # 由编排侧拼进 URL，不需要在配置里另开一段。
    #
    # ⚠️ **必须是 host.docker.internal 而不是 127.0.0.1**。
    #    dtm server 现在是 compose 里的容器（dockers/docker-compose.yml 的
    #    `dtm` 服务），它回调分支时看到的 127.0.0.1 是**容器自己**，不是这台
    #    宿主。实测症状极具欺骗性：事务登记成功（trans_global 有行、bff 返回
    #    gid），但八个分支全停在 `status=prepared` / `finish_time` NULL，
    #    dtm 每 10s 重试一次却永远借不到宿主进程 —— 端口在通、HTTP 面能
    #    应答 newGid，只有去翻 trans_branch_op 才看得出来。
    #    宿主侧 `ping host.docker.internal` 同样解析到 127.0.0.1，所以这个写法
    #    对「进程版 dtm」（`$(go env GOPATH)/bin/dtm`）也一样成立。
    #
    # TCC 只读 stock / points / order 三个键 —— 商品域没有冻结语义，它的分支面
    # 只有 Saga 的加销量/减销量，故 product 配没配与预售锁单无关
    # （NewTCC 的 validate 也不查它，见 internal/dtm/tcc.go）。
    stock:   "host.docker.internal:9043"
    order:   "host.docker.internal:9042"
    product: "host.docker.internal:9041"
    points:  "host.docker.internal:9044"

xmiddleware:
  # ----- dtm：全局事务管理器（Saga / TCC 的提交面）-----
  # launchx 不构造 dtm 组件（它不是内建组件），编排地址由本档的 app/setup.go
  # 直接读，见那里的 installDtmSaga（Saga）与 installDtmTCC（TCC）。
  # 两条链共用这一个地址：同一台 dtm server 同时推进两种事务，分开配只会让
  # 分成两台、而分支 URL 全在另一台上。
  dtm:
    grpc_addr: "127.0.0.1:36790"

  # ----- 出向 RPC 治理（重试 / 熔断 / 负载均衡）-----
  # 它不是组件：三项都只在客户端选项装配那一刻起作用，故配置面收在 rpcx、
  # 由 mode 在装配期读进 App.RPCClientOptions 产出的选项里。**零值全关**，
  # 不写这一段 = 产生的 client.Option 与引入治理之前逐字相同。
  rpcx:
    # 熔断：服务级（调用方/被调方）+ 实例级两道闸。阈值写出来是为了让当前
    # 生效值可见（不写则用 kitex 缺省，同样是 0.5 / 200）。打开它**不改成功
    # 路径**，作用是在持续故障时快速失败，而不是继续把请求打到坏实例上。
    circuit_breaker:
      enabled: true
      error_rate: 0.5      # 触发熔断的错误率阈值，取值 (0,1]
      min_sample: 200      # 触发熔断所需的最小样本数
    # 重试：本档**故意不开**。这条链路上有非幂等写（下单 / 扣减 / 入账），
    # 传输层超时重试会产生重复落库；且一旦网格侧也开了 HTTP 跳重试，
    # 故障期双侧重试会互相放大（ACCEPTANCE §13.5 硬规则 1）。
    # 开启前先确认两件事：max_attempts ≤ 5（kitex 越界即 panic，装配期已拦）、
    # Istio VirtualService 的 retries 为空。
    # 再看一眼预算：单次业务调用最坏耗时 ≈ (1 + max_attempts) × RPCTimeout
    #（rpcx 缺省 3s），三试就是 9s —— 已盖过入口的 webx.timeout(5s)，
    # 表现为引擎先 504、而重试还在后台跑。真开重试须同时收紧 max_duration_ms。
    retry:
      enabled: false
      max_attempts: 2      # 不含首次调用
      backoff_ms: 10       # 固定退避；0 = 不退避
    # 负载均衡：闭集 weighted_random（缺省）/ weighted_round_robin /
    # interleaved_weighted_round_robin。刻意**不给** consistent_hash ——
    # 它需要业务侧的 key 函数，没有默认值，配了只会把请求全打到同一实例上。
    # 不写这一项即用 kitex 缺省（weighted_random）。

  # ----- cachex：令牌凭据存储 -----
  # 为什么 bff 要有数据层：它是**边界**，验凭据需要一处进程外的凭据存储 ——
  # 用本地 map 会让"一次签发要能被所有 bff 实例认"这件事不成立，多实例部署时
  # 表现为"请求随机 401"（签发落在哪个实例上，哪个实例才认）。
  # 业务数据仍然只走下游四个域服，这里存的不是业务数据。
  cachex:
    driver: redis
    enable_trace: true
    instances:
      demo-bff:
        addr: "127.0.0.1:6379"
        db: 2                # 与四个域服的 db 0 / db 1 分开：凭据被逐出 = 全员 401
        pool_size: 30


  # ----- coordx：注册中心 -----
  # bff 的两个用途都落在这里：把自己注册进注册中心供 gateway 发现（由 launchx
  # 按 mode 做），以及 App.RPCClientOptions 里的 coordx resolver
  #（发现四个下游域服 demo-product / demo-stock / demo-order / demo-points）。
  coordx:
    driver: consul
    addr: "127.0.0.1:8500"
    enable_trace: true

  # bff 不建数据层：无 sqlx / cachex / mqx 段。业务数据的唯一入口是下游四个域服。

# 组件的启用是 presence-based（配了段才构造），失败姿态由 strict.<name> 裁决。
# 本档只对 dtm 显式声明，缺省同样是 false（降级），写出来是为了把这条口径
# 摆到明面上而不是靠默认值：dtm 不可达时 bff 提交 5xx + Warn **带病运行**，
# 进程不能退 —— 交易链路挂掉不该把商品/库存/订单的查询面一起带走。
# 其余组件（consul 等）本档同样不设 strict，理由见 ACCEPTANCE §10 降级路径。
strict:
  dtm: false
