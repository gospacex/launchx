// bff 侧的 dtm 分支请求信封（编排侧只做「提交」，不承接回调）。
//
// 为什么不复用各域 internal/dtm/protos/busi.pb.go：那是各域 srv-* 包的
// **internal** 产物，Go 的 internal 规则下只有 srv-<域>/ 子树能 import，
// bff 在 examples/micro/bff/ 下，import 会被编译器直接拒。
//
// 那为什么不用结构体手搓 payload：dtmgrpc.(*SagaGrpc).Add 的第三参是
// `proto.Message`，dtmgimp.MustProtoMarshal 走 proto.Marshal —— 必须是真
// proto 消息，编码出来的字节才会与分支侧的 StockBusiReq / OrderBusiReq /
// ProductBusiReq / PointsBusiReq 逐字节一致。
//
// 三个字段的编号与类型**必须**与四域的 busi.proto 逐字相同（1/2/3 全是
// string）。proto 线上不带消息名（名字只在 descriptor 里），所以一个消息
// 类型编出的字节能被四个不同名的分支请求类型解开 —— 这正是本文件存在的前提。
// 编号一旦漂移，分支面拿到的是全零值：biz 为空 → JSON 反序列化失败 → 业务失败，
// 而症状表现为「每个分支都 4002」，看起来像载荷格式写错，很少有人会想到
// 是编排侧的字段编号对不上。
//
// 字段语义（与四域一致）：
//   - biz 业务体的原始 JSON，各域形状不同（stock/product/points/order 四种 DTO）；
//   - traceparent W3C 链路上下文。正向分支由 bff 编进载荷，分支面
//     dtmx.ExtractParent 挂回同一条 trace。**补偿分支也带着它**：dtm server 的
//     GenBranches 对同一 step 的 compensate / action 两条分支塞同一个
//     BinPayloads[i]（dtm v1.19.0 dtmsvr/trans_type_saga.go），所以补偿段会
//     Extract 回同一条 trace —— 这与「dtm 不透传自定义 metadata」是两件事，
//     载荷是载荷、metadata 是 metadata，两者常被混为一谈。
//     只有载荷里根本没有 traceparent 的异步段（dtm 重启后续推等无编排侧注入
//     的路径）才落到 dtmx.ExtractParent 的空值分支：原样返回 ctx，按「新根
//     trace + biz.dtm.gid 关联」记录。
//   - fail_inject 失败注入目标分支名（演示用）：等于该分支方法名即返业务失败，
//     用于点火逆序补偿链。真机恒为空。
//
// 生成命令（在 internal/dtm/ 下执行）：
//
//	protoc --go_out=. --go_opt=paths=source_relative -I . protos/busi_branch.proto
//
// 不生成 grpc：bff 侧从不提供也不直连分支面（dtm server 才拨号），这里只需要
// 请求消息的类型。文件名取 busi_branch.proto 而不是 busi.proto：四域的生成物
// 已把 protos/busi.proto / internal/dtm/protos/busi.proto 注册进 protobuf 全局
// 描述符表，重名会在**同进程**里 panic（init 期冲突）。虽然 bff 不 import
// 任何一个域，但让两件事不必互相成立，是更便宜的防线。

syntax = "proto3";

package dtmbranch.bff;

option go_package = "github.com/gospacex/launchx/examples/micro/bff/internal/dtm/protos;bffbranch";

// BusiReq dtm 分支请求（bff 侧只编不解）。
message BusiReq {
  // biz 业务体的原始 JSON。反序列化发生在各域 service 层的领域 DTO 上，
  // 编排侧不碰。
  string biz = 1;
  // traceparent W3C 链路上下文，续链用。
  string traceparent = 2;
  // fail_inject 失败注入目标分支名（演示用）。
  string fail_inject = 3;
}

// BusiResp dtm 分支响应（bff 侧只解不编）。TCC 专用。
//
// 为什么 TCC 需要它而 Saga 不需要：`dtmgrpc.(*TccGrpc).CallBranch` 的第五参
// `reply interface{}` 会被 grpc-go 的 proto codec 当成待反序列化的目标，
// 而 grpc v1.83 的 `messageV2Of(nil)` 直接返回 nil → Unmarshal 报
// "failed to unmarshal, message is <nil>, want proto.Message"。Saga 的
// `Add` 不收 reply（dtm 拿 raw codec 从不解析响应体），故此前不需要这个类型。
//
// 字段编号与类型逐字对齐四域的 StockBusiResp / OrderBusiResp / PointsBusiResp
// （1:int64 code、2:string message）。**dtm server 不读这两个字段**（它只看
// gRPC status，见各域 busi.proto 里 Resp 的注释）—— 留着的唯一理由是 grpc
// 要有个合法的反序列化目标，所以这里不解析、不据此判成败。
message BusiResp {
  int64 code = 1;
  string message = 2;
}