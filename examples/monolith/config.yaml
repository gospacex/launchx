# 单体 demo 配置（service.mode=monolith）
#
# 端口/DSN/监听地址一律来自本文件，业务 Go 代码不出现任何硬编码地址
# （同一份二进制与配置副本才能被网格直接复用）。
#
# 本 demo 不注册：刻意**不出现** coordx / consul 段（单体形态不注册，
# 出现 deregister 日志即说明 mode 串档，见 ACCEPTANCE 陷阱 11）。
#
# 运行前导出库密码：export HUBX_DB_PW=hubx123

service:
  name: demo-monolith   # 服务名 = Jaeger 的 service，也是各组件的实例名
  mode: monolith        # 四档之一：monolith / bff / srv / gateway

webx:
  addr: "127.0.0.1:8080"
  timeout: 5s
  rate_limit_rps: 100
  rate_limit_burst: 200
  cors_origins: []
  health_prefix: /healthz

# 调用链：全局闸 + 组件级开关。各 trace.on.* 既是 T13 反向断言的唯一开关，
# 也是「能不能在 Jaeger 上看见这个外部依赖」的决定项 —— 关掉任一项，
# 对应组件的 span 必须消失；关了还看得见，说明埋点没接进统一开关。
trace:
  enabled: true
  endpoint: "127.0.0.1:4318"   # jaeger OTLP/HTTP
  on:
    db: true
    cache: true
    kv: true
    mq: true
    search: true
    mongodb: true

logx:
  level: info
  otel:
    # 组件级 span 开关。**故意不写 exporter/endpoint**：logx.Config 虽能解析这两键，
    # 但 launchx 装配路径从不读它们（span 出口由 trace.endpoint 决定，见
    # internal/telemetry.Init），写了只会让人误以为「日志走 otlp」。
    enable_trace: true

# 指标（Prometheus 拉取式）。装配期建 MeterProvider 并设为 otel 全局 ——
# HTTP 面自动挂到 webx 的 MetricsPrefix（缺省 /metrics，并豁免入口限流），
# RPC 客户端/服务端中间件也按这一开关挂。**关掉（false 或不写）即不建 provider**，
# meter 退回 noop：不产生指标、不留采集口，但 Instrument 调用点仍在（不会少埋点）。
metrics:
  enabled: true
# 地基失败即退：db 连不上就启动失败，而不是降级成"起来但落不了库"。
# 其余组件不设 strict —— 它们缺失时须带病运行（降级 Warn + 进程不退出），
# 见 ACCEPTANCE §10 降级路径。
strict:
  db: true

# demo 自身的业务参数（非地址类，但同样不写死在代码里）。
# 只放「会随环境或演示意图调整」的项：令牌、窗口、索引名、集合名、TTL。
demo:
  auth_token: "demo-token"          # 演示用静态令牌，经缓存校验（middleware.auth 的外部依赖）
  rate_limit_per_min: 300           # 单 IP 每窗口上限（宽松，压测不会误伤）
  cache_ttl: 60s                    # 订单缓存有效期
  order_index: "orders"             # ES 索引名
  snapshot_collection: "order_snapshots"  # Mongo 集合名

xmiddleware:

  # ----- sqlx：私有库 order_db（账号 order_rw）-----
  sqlx:
    driver: gorm
    databases:
      demo-monolith:            # 实例名须与 service.name 一致（dbx loader 按名字取段）
        dsn: "order_rw:${HUBX_DB_PW}@tcp(127.0.0.1:3306)/order_db?charset=utf8mb4&parseTime=True&loc=Local"
        max_open_conns: 20
        max_idle_conns: 5
        conn_max_lifetime: 5m
        conn_max_idle_time: 1m
        tracing:
          enabled: true

  # ----- cachex：订单缓存 + 鉴权令牌 -----
  # 限流计数已迁到下面的 kvx（需要原子自增），这里只留"可失效"的两类用法。
  # 每种用途都会各产一个 span，Jaeger 上按 operationName 可区分。
  cachex:
    driver: redis
    enable_trace: true
    instances:
      demo-monolith:
        addr: "127.0.0.1:6379"
        db: 0
        pool_size: 50

  # ----- kvx：限流计数（单 IP 固定窗口，见 demo.rate_limit_per_min）-----
  #
  # 为什么不沿用 cachex：cachex.Cache 没有 Incr，计数只能 Get→+1→Set，
  # 并发下两个请求读到同一旧值、写回同一新值（lost update），计数系统性低估
  # —— 表现为"限流配了却照样被打穿"，且 Jaeger 上一切正常，最难自查。
  # kvx.KVStore 的 Incr 走 Redis 原子自增，语义正对。
  #
  # 与 cachex 共用同一个 redis，但句柄分开：缓存被逐出是可接受的（回源即可），
  # 计数被逐出等于限流静默失效，混用一个句柄就分不清这两种后果。
  kvx:
    driver: redis
    enable_trace: true
    instances:
      demo-monolith:
        addr: "127.0.0.1:6379"
        db: 1
        pool_size: 30

  # ----- mqx：下单事件投递（topic order.completed.v1）-----
  # ⚠️ 键位口径（mqx 现状，2026-10-05 实测）：producer 的目标 topic **不读
  # producer.topic**，FillDefaults 只把 consumer.topic（缺省 default-topic）填给
  # writer。再加一层 msg.Topic 会撞上 kafka-go 的
  # "Topic must not be specified for both Writer and Message"。
  # 故这里按 SDK 实际生效的键配 consumer.topic，业务侧 Message 不再带 topic。
  mqx:
    driver: kafka
    instances:
      demo-monolith:
        brokers:
          - "127.0.0.1:9092"   # 本机 compose 现行端口（**不**用 srv-order 旧端口 19093）
        enable_trace: true
        consumer:
          topic: order.completed.v1
          # group_id 必须显式写：mqx 的 FillDefaults 在缺省时统一填 "mqx-group"，
          # 于是所有服务挤进同一个消费组 —— 订阅同一 topic 的服务会互相抢分区，
          # 表现为「消息投出去了但没人收到」。消费组按服务命名是硬要求。
          group_id: demo-monolith
        producer:
          batch_size: 100
          batch_timeout: 10ms
          # acks=all：sarama RequiredAcks -1 = WaitForAll
          required_acks: -1

  # ----- searchx：订单检索（ES 索引见 demo.order_index）-----
  # legacy_cluster: 本机 compose 的 ES 是 7.6.2，不返回 X-Elastic-Product 头，
  # 官方 v8 客户端会拒绝每一个响应。打开后驱动在响应上补齐该头。
  # 升级到 7.14+ 后应删掉这一行。
  searchx:
    driver: elasticsearch
    address:
      - "http://127.0.0.1:9200"
    enable_trace: true
    legacy_cluster: true

  # ----- mongodbx：订单快照（集合见 demo.snapshot_collection）-----
  # 注意：mongodbx 没有实例级 enable_trace，Config 字段也没有 mapstructure tag，
  # 故地址类键只能用 uri / database / driver（蛇形键会被静默丢弃）。
  mongodbx:
    instances:
      demo-monolith:
        driver: mongodb
        uri: "mongodb://127.0.0.1:27018"
        database: order_demo
        max_pool_size: 50
