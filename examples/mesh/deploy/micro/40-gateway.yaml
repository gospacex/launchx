# 网格形态 · gateway（流量入口）
#
# 与 micro/gateway 的差异只有三处，全在部署面（业务代码零改动）：
#   1. 监听 127.0.0.1:8080 -> 0.0.0.0:8080（绑回环则 Pod 外不可达）
#   2. consul 地址指向集群内 Service（见 consul.yaml 的说明）
#   3. 配置来自 ConfigMap 而非仓库内文件
apiVersion: v1
kind: Service
metadata:
  name: demo-gateway
  namespace: launchx-mesh
spec:
  selector:
    app: demo-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-gateway
  namespace: launchx-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-gateway
  template:
    metadata:
      labels:
        app: demo-gateway
    spec:
      containers:
        - name: app
          image: launchx-demo:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/demo-gateway"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /app/conf/config.yaml
              subPath: gateway.yaml
          # O3：三 Deployment 统一 tcpSocket 探针 —— srv 档没有 HTTP 端点，
          # 用 httpGet 就得为探针单独开路由；tcpSocket 语义统一，就绪语义
          # 交给 consul 的 TTL/健康检查承载。
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: conf
          configMap:
            name: demo-configs
