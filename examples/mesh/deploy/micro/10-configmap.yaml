# =============================================================================
# 网格案例的三份配置副本（gateway / bff / srv）
# -----------------------------------------------------------------------------
# 与 examples/micro/*/config.yaml 的关系：**只有地址段的差异**，业务字段一字未动。
# 这正是 C4/T8 论证的落点 —— 网格形态不改代码，只换配置副本 + 部署清单。
#
# 地址换算表（宿主 <-> 集群）：见 README「地址换算」段，来源是 ACCEPTANCE §C-0c
#   127.0.0.1:3306  -> host-middleware.launchx-mesh.svc.cluster.local:3306   （mysql 在宿主 compose）
#   127.0.0.1:6379  -> host-middleware.launchx-mesh.svc.cluster.local:6379   （redis）
#   127.0.0.1:9092  -> host-middleware.launchx-mesh.svc.cluster.local:9092   （kafka）
#   127.0.0.1:4318  -> host-middleware.launchx-mesh.svc.cluster.local:4318   （jaeger OTLP/HTTP）
#   127.0.0.1:8500  -> consul.launchx-mesh:8500      （consul **部署进集群**，
#                       理由见 README「为什么 consul 要进集群」）
#   127.0.0.1:8080/8081/9013 -> 0.0.0.0:同端口        （容器内必须监听全地址，
#                       绑 127.0.0.1 在 Pod 外不可达，是网格最经典的坑）
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-configs
  namespace: launchx-mesh
data:
  # ---------------------------------------------------------------- gateway
  gateway.yaml: |
    service:
      name: demo-gateway
      mode: gateway
      addr: "0.0.0.0:8080"
      upstream:
        demo-bff: ""        # 集群内走 consul 发现；留空 = 上游地址只有一个来源
    webx:
      addr: "0.0.0.0:8080"
      timeout: 5s
      rate_limit_rps: 100
      rate_limit_burst: 200
      cors_origins: []
      health_prefix: /healthz
    gateway:
      routes:
        - prefix: /api
          upstream: demo-bff
          strip: true
          name: api
    trace:
      enabled: true
      endpoint: "host-middleware.launchx-mesh.svc.cluster.local:4318"
      on:
        registry: true
    logx:
      level: info
      otel:
        enable_trace: true
    # 指标（Prometheus 拉取式）。装配期建 MeterProvider 并设为 otel 全局 ——
    # HTTP 面自动挂到 webx 的 MetricsPrefix（缺省 /metrics，并豁免入口限流）。
    # 关掉（false 或不写）即不建 provider，meter 退回 noop。
    metrics:
      enabled: true
    xmiddleware:
      coordx:
        driver: consul
        addr: "consul.launchx-mesh.svc.cluster.local:8500"
        enable_trace: true

  # -------------------------------------------------------------------- bff
  bff.yaml: |
    service:
      name: demo-bff
      mode: bff
      addr: "0.0.0.0:8081"
      self:
        # Downward API 注入的 POD_IP（见 bff.yaml 的 env），configsrc 会做
        # os.ExpandEnv 展开 —— 零代码改动把「自身注册地址」配置化（P3）
        addr: "${POD_IP}:8081"
      upstream:
        demo-srv: ""
    webx:
      addr: "0.0.0.0:8081"
      timeout: 5s
      rate_limit_rps: 100
      rate_limit_burst: 200
      cors_origins: []
      health_prefix: /healthz
    trace:
      enabled: true
      endpoint: "host-middleware.launchx-mesh.svc.cluster.local:4318"
      on:
        registry: true
    logx:
      level: info
      otel:
        enable_trace: true
    # 指标（Prometheus 拉取式）。装配期建 MeterProvider 并设为 otel 全局 ——
    # HTTP 面自动挂到 webx 的 MetricsPrefix（缺省 /metrics，并豁免入口限流）。
    # 关掉（false 或不写）即不建 provider，meter 退回 noop。
    metrics:
      enabled: true
    xmiddleware:
      # ----- 出向 RPC 治理（重试 / 熔断 / 负载均衡）-----
      # 不是组件：三项都只在客户端选项装配那一刻起作用，配置面收在 rpcx、
      # 由 mode 在装配期读进 App.RPCClientOptions。零值全关，不写 = 不加选项。
      rpcx:
        # 熔断：服务级 + 实例级两道闸。阈值写出来是为了让生效值可见。
        # 打开它不改成功路径，作用是在持续故障时快速失败。
        circuit_breaker:
          enabled: true
          error_rate: 0.5
          min_sample: 200
        # 重试：故意不开 —— 链路上有非幂等写（下单/扣减/入账），超时重试会重复落库；
        # 且网格侧若也开 HTTP 跳重试，故障期双侧重试互相放大（ACCEPTANCE §13.5 硬规则 1）。
        # 超时预算也不够：三试 ≈ 3 × RPCTimeout（rpcx 缺省 3s）= 9s > 入口 webx.timeout 5s。
        retry:
          enabled: false
          max_attempts: 2
          backoff_ms: 10
        # 负载均衡：闭集 weighted_random（缺省）/ weighted_round_robin /
        # interleaved_weighted_round_robin；不给 consistent_hash（需业务 key 函数）。
      coordx:
        driver: consul
        addr: "consul.launchx-mesh.svc.cluster.local:8500"
        enable_trace: true

  # -------------------------------------------------------------------- srv
  srv.yaml: |
    service:
      name: demo-srv
      mode: srv
      # ⚠️ 这里**不能**写 0.0.0.0，必须写 ${POD_IP}：见 README「srv 档注册地址的坑」。
      # srv 档的注册是由 kitex(rpcx) 用**监听地址**发出，而 consul 只接受可路由地址，
      # 收到 0.0.0.0 会返回 `400 Invalid service address` 并让进程直接退出。
      # 监听 Pod IP 本身是完全合法的（该 IP 就在 Pod 自己的网卡上）。
      addr: "${POD_IP}:9013"
      self:
        addr: "${POD_IP}:9013"
    trace:
      enabled: true
      endpoint: "host-middleware.launchx-mesh.svc.cluster.local:4318"
      on:
        db: true
        kv: true
        mq: true
        registry: true
    logx:
      level: info
      otel:
        enable_trace: true
    # 指标（Prometheus 拉取式）。srv 档**没有 HTTP 面**，故显式给采集口地址：
    # 装配期单起一个只服务 /metrics 的监听，不占服务端口、不参与业务路由。
    # enabled=true 却漏配 addr 时装配期即退（否则指标被采集却无人能读，且不报错）。
    # 容器内必须监听全地址 —— 绑 127.0.0.1 在 Pod 外不可达（见 bring-up.sh check）。
    metrics:
      enabled: true
      addr: "0.0.0.0:9030"
    strict:
      db: true
    xmiddleware:
      sqlx:
        driver: gorm
        databases:
          demo-srv:
            dsn: "order_rw:${HUBX_DB_PW}@tcp(host-middleware.launchx-mesh.svc.cluster.local:3306)/order_db?charset=utf8mb4&parseTime=True&loc=Local"
            max_open_conns: 20
            max_idle_conns: 5
            conn_max_lifetime: 5m
            conn_max_idle_time: 1m
            tracing:
              enabled: true
      # ----- kvx：限流计数（与 examples/micro/srv/config.yaml 同源）-----
      # srv 除限流外不再使用缓存：cachex 无原子 Incr，计数会被并发读-改-写覆盖
      # 成低估，故整段替换为 kvx。
      kvx:
        driver: redis
        enable_trace: true
        instances:
          demo-srv:
            addr: "host-middleware.launchx-mesh.svc.cluster.local:6379"
            db: 0
            pool_size: 30
      mqx:
        driver: kafka
        instances:
          demo-srv:
            brokers:
              - "host-middleware.launchx-mesh.svc.cluster.local:9092"
            enable_trace: true
            producer:
              topic: order.completed.v1
              batch_size: 100
              batch_timeout: 10ms
              required_acks: -1
      coordx:
        driver: consul
        addr: "consul.launchx-mesh.svc.cluster.local:8500"
        enable_trace: true
