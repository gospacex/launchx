# =============================================================================
# 宿主中间件的集群内门面（无 selector 的 Service + 手工 Endpoints）
# -----------------------------------------------------------------------------
# 为什么需要这层：
#   1. Istio 的 tracing extensionProvider **必须指向集群内的 Service**。
#      直接写 host.minikube.internal 会被 istiod 拒绝，日志是：
#        could not find service host.minikube.internal in Istio service registry
#      → Envoy 侧根本不生成 OTLP cluster → 一条 sidecar span 都不会有（T10 假阴性）。
#   2. 业务配置里统一写一个集群 DNS 名，比散落 host.minikube.internal 更好读，
#      而且换宿主地址只需改这一处。
#
# Endpoints 的 IP = 从 minikube 视角看宿主的地址，**清单里是写死的值**：
# 当前 192.168.65.254 对应本机（Docker Desktop + minikube docker driver）实测。
# 换环境**必须手工改这一行**，取值命令：
#   minikube ssh -- "getent hosts host.minikube.internal" | awk '{print $1}'
#
# ⚠️ 别被上一版注释骗了：它写着「由 bring-up.sh 自动替换」，但
# `examples/mesh/scripts/bring-up.sh` 里**没有任何替换或校验逻辑**（全仓检索
# `HOST_MW_IP` 只命中本文件与 `mesh/docs/verify.md`，脚本侧零命中），本仓也
# 没有 envsubst 之类的模板约定。也就是说：换机器后忘记改这一行 = 静默连不上
# 宿主中间件，而症状散在各处、都不指向真因 —— OTLP 无导出（sidecar span 全丢）、
# 四域 `strict.db` 报库连不上、kafka 元数据拿不到（broker 地址不可达）。
# 清单侧无法把它写成占位符（Endpoints 要求合法 IP，占位串会被 API server 拒），
# 故只能把来源与替换义务写清楚。
# 脚本侧应当补一步「apply 前按上面那条命令替换 + apply 后比对」，已转给负责
# scripts 的同学（openspec 的 mesh-environment spec 里也有同一条判据）。
#
# 端口名必须是 `grpc-` 前缀（不要写成 otlp-grpc）：
#   Istio 靠**端口名前缀**判定上游协议。写成 otlp-grpc 时它认不出来 → 落到
#   默认 HTTP，cluster 只带 `use_downstream_protocol_config`，也就是「跟着下游
#   走」。但 Envoy 自己的 OTLP 导出**没有下游**，于是回落 HTTP/1.1，gRPC 流被
#   对端 reset，sidecar span 全丢，日志只有一句：
#     OTLP trace export failed with status: Unavailable ...
#     reset reason: protocol error{upstream_reset_before_response_started{protocol_error}}
#   这条错误只在 `curl -X POST localhost:15000/logging?level=debug` 之后才可见
#   （默认 warning 级别不打印），是最难查的一处。
#   改名 grpc-otlp 后 Istio 会给该 cluster 打上 http2_protocol_options，导出打通。
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: host-middleware
  namespace: launchx-mesh
spec:
  # 刻意**不写 selector**：后端由下面的 Endpoints 手工指定（宿主不在 Pod 网络里）
  ports:
    - name: mysql
      port: 3306
      protocol: TCP
    - name: redis
      port: 6379
      protocol: TCP
    - name: kafka
      port: 9092
      protocol: TCP
    # kafka-mesh（9094）：宿主 Kafka 的 MESH 监听器，advertised 地址就是这个
    # Service 名（见 dockers/docker-compose.yml 的 KAFKA_CFG_ADVERTISED_LISTENERS）。
    # 9092 那个监听器的 advertised 是 127.0.0.1:9092 —— 在 Pod 里等于 Pod 自己，
    # 连上 bootstrap 之后必然 `connection refused`。**Pod 侧必须用 9094。**
    - name: kafka-mesh
      port: 9094
      protocol: TCP
    - name: grpc-otlp
      port: 4317
      protocol: TCP
      appProtocol: grpc # 双保险：即便 Istio 不认端口名前缀，appProtocol 也会强制 h2
    - name: otlp-http
      port: 4318
      protocol: TCP
    - name: consul-host
      port: 8500
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: host-middleware
  namespace: launchx-mesh
subsets:
  - addresses:
      # 宿主地址（minikube 视角），**写死值，换环境必须手工改这一行**：
      #   当前 192.168.65.254 = 本机 Docker Desktop + minikube(docker driver) 实测；
      #   取值：minikube ssh -- "getent hosts host.minikube.internal" | awk '{print $1}'
      # 没有脚本会替换它（见头注），也没有 envsubst 约定。
      - ip: 192.168.65.254
    ports:
      - name: mysql
        port: 3306
      - name: redis
        port: 6379
      - name: kafka
        port: 9092
      - name: kafka-mesh
        port: 9094
      - name: grpc-otlp
        port: 4317
      - name: otlp-http
        port: 4318
      - name: consul-host
        port: 8500
