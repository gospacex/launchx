# =============================================================================
# apps 组 · 数据库口令（2026-10-10 企业级加固：env 明文 → Secret）
# -----------------------------------------------------------------------------
# 为什么改：此前 HUBX_DB_PW 以 env value 明文写在四份 2x-srv-*.yaml 里，
# 任何有 get deploy 权限的人（含 CI 日志、kubectl describe 输出）都能读到口令。
# Secret 至少做到了：① 与清单阅读权限分离（可单独收紧 RBAC 到 get secret）；
# ② describe pod 不再回显值；③ 轮换只改一处。
#
# ⚠️ 这仍是**教学集群的占位口令**（与宿主 compose 的 mysql 初始化一致）：
#   - 它进了 git，等于公开 —— 能这么做只因为目标库是本机 docker 里的演示实例；
#   - 生产形态应当是：本文件**只留骨架不进仓**（或由 CI 注入），真值来自
#     External Secrets / sealed-secrets / Vault，且按周期轮换；
#   - 因此本文件刻意用 stringData 而不是 data：让人一眼看清「这就是占位」，
#     而不是 base64 之后假装它不是明文。
#
# 消费侧：四份 2x-srv-*.yaml 的 env HUBX_DB_PW 改为
#   valueFrom.secretKeyRef{name: mesh-apps-db, key: HUBX_DB_PW}
# bff 不消费（它没有 DB 句柄）。
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mesh-apps-db
  namespace: launchx-mesh
type: Opaque
stringData:
  HUBX_DB_PW: hubx123 # 教学占位，见头注 ⚠️
