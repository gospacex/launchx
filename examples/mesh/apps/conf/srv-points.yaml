# =============================================================================
# 积分域（apps 组）—— srv 档配置
# -----------------------------------------------------------------------------
# 由 conf/srv-order.yaml 改写而来，与它的差异**逐项列全**：
#   1. service.name 与各实例名 → srv-points；addr → 0.0.0.0:9024；
#   2. 删 cachex / lockx：本域不用缓存、不做互斥（写路径在 MQ 消费侧，
#      不在 HTTP/RPC 入向）；
#   3. **保留 kvx**：route 的限流计数用它。spec mesh-app-handles 的原话是
#      「全部 srv-* 都用 KV()[name]，四域一视同仁 —— 不因『本域 RPC 面只读』
#      而省略」：该跳走 Kitex TTHeader/TCP、Envoy 按 tcp_proxy 处理拿不到
#      L7 限流，route 的 middleware 是本跳唯一的治理手段，删掉它这一跳就没有
#      限流了（而缺 kvx 是 fail-open，不会报错，只会静默放行）；
#   4. trace.on 保留 db / kv / mq：在册句柄逐个要有对应开关，
#      否则 handles 自检不核对它（Want=false 时 Diverged 恒为假）。
# =============================================================================
service:
  name: srv-points
  mode: srv
  addr: "0.0.0.0:9024"

trace:
  enabled: true
  endpoint: "host-middleware.launchx-mesh.svc.cluster.local:4318"
  on:
    db: true
    kv: true
    mq: true

logx:
  level: info
  otel:
    # 组件级 span 开关。**故意不写 exporter/endpoint**：logx.Config 虽能解析这两键，
    # 但 launchx 装配路径从不读它们（span 出口由 trace.endpoint 决定，见
    # internal/telemetry.Init），写了只会让人误以为「日志走 otlp」。
    enable_trace: true

# 指标（Prometheus 拉取式）。srv 档**没有 HTTP 面**，故必须显式给采集口地址：
# 装配期单起一个只服务 /metrics 的监听，不占服务端口、不参与业务路由。
# enabled=true 却漏配 addr 时**装配期即退**（否则指标被采集却无人能读，且不报错）。
metrics:
  enabled: true
  addr: "0.0.0.0:9032"
strict:
  db: true

xmiddleware:
  # ----- sqlx：order_db（积分余额与流水）-----
  # 入链由组件级开关 trace.on.db 裁决；tracing 子段不被 launchx 读取
  #（详见 srv-order.yaml 的同名说明）。
  sqlx:
    driver: gorm
    databases:
      srv-points:
        dsn: "order_rw:${HUBX_DB_PW}@tcp(host-middleware.launchx-mesh.svc.cluster.local:3306)/order_db?charset=utf8mb4&parseTime=True&loc=Local"
        max_open_conns: 20
        max_idle_conns: 5
        tracing:
          enabled: true

  # ----- kvx：RPC 跳限流计数（route 的 middleware 用原子 Incr）-----
  # db 1 是四域 kvx 的**公共逻辑库**：计数键都带服务名前缀，分开库只会让
  # 「同一份计数散在四个库里」更难排查。
  kvx:
    driver: redis
    enable_trace: true
    instances:
      srv-points:
        addr: "host-middleware.launchx-mesh.svc.cluster.local:6379"
        db: 1
        pool_size: 30

  # ----- mqx：order.completed.v1 —— 本域是**消费**端 -----
  mqx:
    driver: kafka
    instances:
      srv-points:
        # 同 srv-order：MUST 用 9094（kafka-mesh 监听器），9092 的 advertised
        # 地址在 Pod 内指向自己，消费侧会连不上 broker（症状是「一条消息都收不到」，
        # 且 producer 侧一切正常）。
        brokers:
          - "host-middleware.launchx-mesh.svc.cluster.local:9094"
        enable_trace: true
        # consumer.topic MUST 等于 events.TopicOrderCompleted
        #（"order.completed.v1"）：mqx/kafka 的两侧都读这一个键，
        # 写错的症状是「消息发了没人收」，且两侧日志都不报错。
        consumer:
          topic: order.completed.v1
          # 独立消费组（理由见 srv-order 同处注释）：不与任何「只创建不消费」的
          # 域共用 group，否则会被抢走分区，表现为「下单消息时灵时不灵地收不到」。
          group_id: mesh-points-v1
